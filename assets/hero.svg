<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
  <title id="t">George Latos - AI Developer and Full-Stack Software Engineer</title>
  <desc id="d">An animated Linux terminal running fastfetch. Role: AI Developer and Software Engineer (Full-Stack) at RENER Energy, building EMS and SCADA software for battery storage and solar PV parks. Stack: C#, .NET, TypeScript, React, Python, Docker, Azure DevOps, Linux.</desc>
  <defs>
    <radialGradient id="glow" cx="18%" cy="0%" r="90%">
      <stop offset="0" stop-color="#6E00FF" stop-opacity=".35"/>
      <stop offset=".55" stop-color="#15101F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="100%" r="70%">
      <stop offset="0" stop-color="#F2C94C" stop-opacity=".14"/>
      <stop offset=".6" stop-color="#15101F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(0 .5 .5)">
      <stop offset="0" stop-color="#6E00FF"/>
      <stop offset=".5" stop-color="#F2C94C"/>
      <stop offset="1" stop-color="#AE94F5"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="150" x2="0" y2="304" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2C94C"/>
      <stop offset=".55" stop-color="#AE94F5"/>
      <stop offset="1" stop-color="#6E00FF"/>
    </linearGradient>
    <clipPath id="type1"><rect x="200" y="96" width="0" height="22"><animate attributeName="width" begin=".5s" dur=".7s" fill="freeze" calcMode="discrete" values="0;9;18;27;36;45;54;63;72;90" keyTimes="0;.11;.22;.33;.44;.55;.66;.77;.88;1"/></rect></clipPath>
    <style>
      .m{font-family:ui-monospace,"JetBrains Mono","Cascadia Code","DejaVu Sans Mono",Menlo,Consolas,monospace}
      .bar{font-size:12px;font-weight:700;fill:#E8E1F7}
      .p{font-size:15px}
      .k{fill:#F2C94C;font-weight:700}
      .v{fill:#E8E1F7}
      .mu{fill:#8A7FA8}
      .art{font-size:21px;font-weight:700;fill:url(#logo)}
    </style>
  </defs>

  <!-- desktop -->
  <rect width="1200" height="500" rx="16" fill="#0A0710"/>
  <rect width="1200" height="500" rx="16" fill="url(#glow)"/>
  <rect width="1200" height="500" rx="16" fill="url(#glow2)"/>

  <!-- top bar (Hyprland / Omarchy style) -->
  <g class="m bar">
    <rect x="12" y="10" width="1176" height="28" rx="8" fill="#15101F" fill-opacity=".7" stroke="#AE94F5" stroke-opacity=".15"/>
    <rect x="22" y="16" width="22" height="16" rx="5" fill="#F2C94C"/>
    <text x="33" y="28.5" text-anchor="middle" fill="#15101F">1</text>
    <text x="58" y="28.5" text-anchor="middle" fill="#AE94F5">2</text>
    <text x="80" y="28.5" text-anchor="middle" fill="#AE94F5">3</text>
    <text x="102" y="28.5" text-anchor="middle" fill="#8A7FA8">4</text>
    <text x="124" y="28.5" text-anchor="middle" fill="#8A7FA8">5</text>
    <text x="600" y="28.5" text-anchor="middle">george@lat0s  ·  omarchy</text>
    <text x="1176" y="28.5" text-anchor="end"><tspan fill="#F2C94C">cpu</tspan> 3%   <tspan fill="#F2C94C">mem</tspan> 41%   <tspan fill="#AE94F5">●</tspan> online</text>
  </g>

  <!-- terminal window -->
  <rect x="24" y="54" width="1152" height="430" rx="12" fill="#15101F" fill-opacity=".94"/>
  <rect x="24" y="54" width="1152" height="430" rx="12" fill="none" stroke="url(#border)" stroke-width="2"/>
  <text x="44" y="78" class="m mu" font-size="12">kitty  ~</text>

  <!-- prompt + typed command -->
  <g class="m p">
    <text x="44" y="112"><tspan class="k">george@lat0s</tspan><tspan fill="#AE94F5"> ~ </tspan><tspan fill="#6E00FF" font-weight="700">❯</tspan></text>
    <text x="200" y="112" class="v" clip-path="url(#type1)">fastfetch</text>
  </g>

