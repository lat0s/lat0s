      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" begin="1.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <g class="m p">
    <g opacity="0"><animate attributeName="opacity" to="1" begin="1.50s" dur=".25s" fill="freeze"/><text x="330" y="148"><tspan class="k">George Latos</tspan><tspan class="mu">@</tspan><tspan fill="#AE94F5" font-weight="700">github.com/lat0s</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="1.58s" dur=".25s" fill="freeze"/><text x="330" y="168" class="mu">─────────────────────────────</text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="1.66s" dur=".25s" fill="freeze"/><text x="330" y="194"><tspan class="k">Role</tspan><tspan class="v" x="424">AI Developer · Software Engineer (Full-Stack)</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="1.74s" dur=".25s" fill="freeze"/><text x="330" y="218"><tspan class="k">Company</tspan><tspan class="v" x="424">RENER Energy S.A. · EMS &amp; SCADA for BESS and solar PV</tspan></text></g>
