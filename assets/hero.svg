    <g opacity="0"><animate attributeName="opacity" to="1" begin="1.98s" dur=".25s" fill="freeze"/><text x="330" y="290"><tspan class="k">AI</tspan><tspan class="v" x="424">LLM applications · RAG · vector search · agents</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.06s" dur=".25s" fill="freeze"/><text x="330" y="314"><tspan class="k">Infra</tspan><tspan class="v" x="424">Linux · Docker · cloud deployments · security</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.14s" dur=".25s" fill="freeze"/><text x="330" y="338"><tspan class="k">CI/CD</tspan><tspan class="v" x="424">Azure DevOps · GitHub Actions · automated testing</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.22s" dur=".25s" fill="freeze"/><text x="330" y="362"><tspan class="k">Edu</tspan><tspan class="v" x="424">MSc Human-Centered AI · BSc Software Engineering (Chalmers/GU)</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.30s" dur=".25s" fill="freeze"/><text x="330" y="386"><tspan class="k">Location</tspan><tspan class="v" x="424">Greece · remote across the EU</tspan></text></g>
  </g>

